# 15차(v1.10.0): 자동 업데이트를 실제 Windows 에서 시험한다 — 설치 파일 두 개를 만들어
# 설치 → 새 버전 받기 → 다음에 켤 때 설치 · [지금 업데이트] · 손상된 파일은 받지 않음 (tools/update_e2e.js).
# main 에 업데이트 관련 파일이 바뀌면 저절로 돌고, Actions 에서 직접 돌릴 수도 있다. Release 는 만들지 않는다.
name: 자동 업데이트 시험 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'build/installer.nsi'
      - 'server.js'
      - 'package.json'
      - 'tools/update_e2e.js'
      - '.github/workflows/update-test.yml'

permissions:
  contents: read

concurrency:
  group: update-test
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
            'C:\Program Files (x86)\NSIS' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: 의존성
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 자동 업데이트 시험
        run: node tools/update_e2e.js
        env:
          ERP_E2E_OK: '1'
